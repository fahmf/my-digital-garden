<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a8c6e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Raport I'dad">
  <title>Raport Evaluasi Pengajar — I'dad Lughawi STDIIS</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="data-loader.js"></script>
  <style>
    :root {
      --accent: oklch(0.45 0.09 165);
      --accent-soft: oklch(0.96 0.04 165);
      --accent-strong: oklch(0.38 0.09 165);
      --bg: oklch(0.985 0.004 165);
      --surface: #fff;
      --surface-2: oklch(0.975 0.006 165);
      --border: oklch(0.92 0.008 165);
      --fg: oklch(0.22 0.01 165);
      --fg-muted: oklch(0.45 0.01 165);
      --fg-subtle: oklch(0.62 0.01 165);
      --good: oklch(0.55 0.14 150);
      --warn: oklch(0.55 0.15 75);
      --bad: oklch(0.55 0.17 25);
      --font: "Plus Jakarta Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --r: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; color: inherit; }

    /* LOGIN PAGE */
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, oklch(0.98 0.006 165), oklch(0.97 0.012 165));
      padding: 24px;
    }
    .login-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04), 0 16px 48px rgba(0,0,0,.06);
    }
    .login-logo {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .login-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
    .login-sub { color: var(--fg-muted); font-size: 13.5px; margin: 0 0 28px; }
    .form-label { font-size: 12.5px; font-weight: 600; color: var(--fg-muted); display: block; margin-bottom: 6px; }
    .form-group { margin-bottom: 18px; }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: var(--surface-2);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--accent); background: white; }
    .form-input.error { border-color: var(--bad); }
    .pin-input {
      letter-spacing: 8px;
      font-family: var(--mono);
      font-size: 20px;
      text-align: center;
      font-weight: 600;
    }
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: var(--bad); font-size: 12.5px; margin-top: 6px; }
    .info-note {
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--accent-strong);
      margin-top: 18px;
      line-height: 1.5;
    }

    /* RAPORT PAGE */
    .raport-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 24px 80px;
    }
    .raport-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      gap: 18px;
    }
    .institution-badge {
      font-size: 12px;
      color: var(--fg-muted);
      margin-bottom: 4px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .raport-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
    .raport-sub { font-size: 13.5px; color: var(--fg-muted); margin-top: 4px; }
    .btn-print {
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-logout {
      padding: 8px 14px;
      background: var(--surface);
      color: var(--fg-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .card { background: white; border: 1px solid var(--border); border-radius: var(--r); padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.03); margin-bottom: 16px; }
    .card-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
    .card-sub { font-size: 12px; color: var(--fg-muted); margin: 0 0 16px; }

    .profile-card {
      background: linear-gradient(135deg, oklch(0.46 0.09 165), oklch(0.35 0.08 175));
      color: white;
      border-radius: 18px;
      padding: 26px 28px;
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
    }
    .av {
      width: 72px; height: 72px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      border: 2.5px solid rgba(255,255,255,0.4);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: var(--font);
    }
    .profile-name { font-size: 22px; font-weight: 800; letter-spacing: -0.015em; }
    .profile-meta { font-size: 13px; opacity: 0.85; margin-top: 3px; }
    .profile-pills { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .profile-pill {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .profile-score {
      margin-left: auto;
      text-align: center;
      background: rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .profile-score .val { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-family: var(--mono); }
    .profile-score .lbl { font-size: 11px; opacity: 0.8; margin-top: 4px; }

    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .kpi { background: white; border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; }
    .kpi-lbl { font-size: 11.5px; color: var(--fg-muted); font-weight: 500; margin-bottom: 6px; }
    .kpi-val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-family: var(--mono); }

    .dim-list { display: flex; flex-direction: column; gap: 10px; }
    .dim-row { display: grid; grid-template-columns: 1fr 120px 64px; gap: 12px; align-items: center; }
    .dim-label { font-size: 13.5px; font-weight: 500; }
    .bar-bg { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.6s ease; }
    .score-pill {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      text-align: center;
      display: block;
    }
    .s100 { background: oklch(0.93 0.07 150); color: oklch(0.35 0.13 150); }
    .s80  { background: oklch(0.95 0.05 150); color: oklch(0.42 0.11 150); }
    .s60  { background: oklch(0.95 0.06 75);  color: oklch(0.45 0.13 75);  }
    .s40  { background: oklch(0.95 0.06 35);  color: oklch(0.5  0.15 35);  }
    .s20  { background: oklch(0.94 0.07 25);  color: oklch(0.5  0.17 25);  }

    .saran-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.55;
    }
    .saran-meta { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 4px; }

    .section-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--fg-subtle);
      margin: 20px 0 10px;
    }

    .catatan {
      background: oklch(0.97 0.04 165);
      border: 1px solid oklch(0.88 0.05 165);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 12.5px;
      color: var(--accent-strong);
      line-height: 1.55;
    }

    /* Watermark area */
    .footer-note {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--fg-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media print {
      @page { margin: 18mm 16mm; }
      body { background: white !important; }
      /* Sembunyikan elemen non-cetak */
      .login-wrap, .btn-print, .btn-logout, .no-print { display: none !important; }
      /* Layout bersih */
      .raport-wrap { max-width: 100%; padding: 0; }
      .card { box-shadow: none !important; border: 1px solid #ddd; break-inside: avoid; }
      /* Jaga warna gradient profile tetap muncul di print */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      /* Hindari page break di tengah card */
      .kpi-row, .dim-list, .saran-item { break-inside: avoid; }
      /* Sesuaikan ukuran agar muat di halaman */
      .profile-score .val { font-size: 32px; }
      .raport-title { font-size: 20px; }
      /* Footer tampil di halaman terakhir */
      .footer-note { border-top: 1px solid #ddd; }
    }

    @media (max-width: 640px) {
      .kpi-row { grid-template-columns: 1fr 1fr; }
      .profile-card { flex-direction: column; }
      .profile-score { margin-left: 0; width: 100%; }
      .dim-row { grid-template-columns: 1fr 72px 52px; gap: 8px; }
      .login-card { padding: 28px 22px; }

      /* Header stacks on mobile */
      .raport-wrap { padding: 16px 14px 60px; }
      .raport-header { flex-direction: column; gap: 10px; margin-bottom: 16px; }
      .raport-header > div:last-child { display: flex; flex-direction: row; gap: 8px; width: 100%; }
      .btn-logout { flex: 1; text-align: center; }
      .btn-print { flex: 1; text-align: center; }
      .raport-title { font-size: 20px; }

      /* Period selector: scrollable */
      .raport-wrap .card > div { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .raport-wrap .card > div::-webkit-scrollbar { display: none; }

      /* Kelas dim bars: shorter label */
      .kelas-dim-row { grid-template-columns: 90px 1fr 40px !important; }

      html, body { overflow-x: hidden; max-width: 100vw; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    function scoreClass(s) {
      if (s >= 95) return "s100";
      if (s >= 80) return "s80";
      if (s >= 65) return "s60";
      if (s >= 50) return "s40";
      return "s20";
    }
    function scoreColor(s) {
      if (s >= 90) return "oklch(0.55 0.14 150)";
      if (s >= 80) return "oklch(0.62 0.13 150)";
      if (s >= 70) return "oklch(0.7 0.14 110)";
      if (s >= 60) return "oklch(0.72 0.15 75)";
      return "oklch(0.65 0.17 25)";
    }
    function initials(name) {
      return name.split(" ").map(s=>s[0]).filter(Boolean).slice(0,2).join("").toUpperCase();
    }

    // Client-side PIN verification — no network call needed
    // PIN = String(10001 + sortedIndex).slice(1) → "0001"–"0027"
    function verifyPinLocal(data, name, pin) {
      const idx = data.PENGAJAR.findIndex(p => p.name === name);
      if (idx < 0) return false;
      const expected = String(10001 + idx).slice(1);
      return pin === expected;
    }

    // ---- Loading Screen ----
    function LoadingScreen({ error, onRetry, tokenChecking }) {
      const msg = tokenChecking
        ? "Memverifikasi link raport…"
        : "Memuat data…";
      const sub = tokenChecking
        ? "Mohon tunggu sebentar"
        : "Mengambil data dari Google Sheets";
      return (
        <div className="login-wrap">
          <div className="login-card" style={{ textAlign: "center" }}>
            <div className="login-logo">إل</div>
            {error ? (
              <>
                <h2 className="login-title" style={{ fontSize: 18 }}>Gagal memuat data</h2>
                <p style={{ color: "var(--fg-muted)", fontSize: 13, margin: "8px 0 20px" }}>{error}</p>
                <button className="btn-primary" onClick={onRetry}>Coba Lagi</button>
              </>
            ) : (
              <>
                <h2 className="login-title" style={{ fontSize: 18 }}>{msg}</h2>
                <p style={{ color: "var(--fg-muted)", fontSize: 13, margin: "8px 0 0" }}>{sub}</p>
                <div style={{ marginTop: 24, display: "flex", justifyContent: "center" }}>
                  <div style={{
                    width: 32, height: 32, border: "3px solid var(--border)",
                    borderTopColor: "var(--accent)", borderRadius: "50%",
                    animation: "spin 0.8s linear infinite"
                  }}/>
                </div>
              </>
            )}
          </div>
          <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
        </div>
      );
    }

    // ---- Login Screen ----
    function LoginScreen({ data, onLogin }) {
      const [name, setName] = useState("");
      const [pin, setPin] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name) { setError("Pilih nama Anda terlebih dahulu."); return; }
        if (pin.length < 4) { setError("PIN harus 4 digit."); return; }
        setLoading(true);
        // Small delay for UX feedback, then verify locally
        setTimeout(() => {
          const ok = verifyPinLocal(data, name, pin);
          setLoading(false);
          if (ok) {
            setError("");
            onLogin(name);
          } else {
            setError("PIN tidak cocok. Hubungi koordinator divisi jika lupa PIN.");
            setPin("");
          }
        }, 400);
      };

      return (
        <div className="login-wrap">
          <div className="login-card">
            <div className="login-logo">إل</div>
            <h1 className="login-title">Raport Evaluasi</h1>
            <p className="login-sub">Divisi I'dad Lughawi STDIIS · Sistem Penilaian Pengajar</p>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label className="form-label">Nama Anda</label>
                <select className={"form-input " + (!name && error ? "error" : "")} value={name} onChange={e => { setName(e.target.value); setError(""); }}>
                  <option value="">— Pilih nama —</option>
                  {data.PENGAJAR.map(p => <option key={p.name} value={p.name}>{p.name}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">PIN (4 digit)</label>
                <input
                  className={"form-input pin-input " + (error ? "error" : "")}
                  type="password"
                  inputMode="numeric"
                  maxLength={4}
                  placeholder="••••"
                  value={pin}
                  onChange={e => { setPin(e.target.value.replace(/\D/g, "").slice(0,4)); setError(""); }}
                />
                {error && <div className="error-msg">{error}</div>}
              </div>
              <button type="submit" className="btn-primary" disabled={loading}>
                {loading ? "Memeriksa…" : "Lihat Raport Saya →"}
              </button>
            </form>
            <div className="info-note">
              PIN didistribusikan secara pribadi oleh koordinator divisi. Setiap pengajar memiliki PIN unik dan hanya bisa melihat data evaluasi miliknya sendiri.
            </div>
          </div>
        </div>
      );
    }

    // Filter teks yang hanya berisi tanda baca / "-" / terlalu pendek
    function isValidText(t) {
      if (!t) return false;
      const s = t.trim();
      return s.length >= 3 && !/^[-.\s,_|/\\]+$/.test(s) &&
             s.toLowerCase() !== "tidak ada" && s.toLowerCase() !== "tidak ada.";
    }

    // Tab button style helper
    function tabStyle(active) {
      return {
        padding: "5px 12px", borderRadius: 8, fontSize: 12,
        fontWeight: active ? 700 : 500, cursor: "pointer",
        border: "1.5px solid", transition: "all 0.15s",
        borderColor: active ? "var(--accent)" : "var(--border)",
        background: active ? "var(--accent-soft)" : "var(--surface)",
        color: active ? "var(--accent-strong)" : "var(--fg)",
      };
    }

    // ─── AI Insight helpers (Raport) ────────────────────────
    function buildRaportAiCacheKey(name, periodeId, rs) {
      const h = rs.map(r => r.kelas + r.matkul).join("|")
        .split("").reduce((a, c) => ((a << 5) - a + c.charCodeAt(0)) | 0, 0);
      return "raport_ai_" + name.replace(/\s+/g, "_") + "_" + periodeId + "_" + h;
    }
    function loadRaportAiCache(key) {
      try {
        const raw = sessionStorage.getItem(key);
        if (!raw) return null;
        const { result, ts } = JSON.parse(raw);
        return Date.now() - ts > 3600000 ? null : result;
      } catch(e) { return null; }
    }
    function saveRaportAiCache(key, result) {
      try { sessionStorage.setItem(key, JSON.stringify({ result, ts: Date.now() })); } catch(e) {}
    }

    async function callGeminiRaport(prompt, signal) {
      const cfg = window.DASHBOARD_CONFIG || {};
      const genCfg = { temperature: 0.7, maxOutputTokens: 6000, thinkingConfig: { thinkingBudget: 0 } };

      if (cfg.APPS_SCRIPT_URL) {
        try {
          const res = await fetch(cfg.APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "gemini", prompt }),
            signal,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const json = await res.json();
          if (json.error) throw new Error(json.error);
          return json.text;
        } catch(e) {
          if (e.name === "AbortError") throw e;
          if (!cfg.GEMINI_API_KEY) throw new Error("Proxy gagal: " + e.message);
        }
      }
      const key = cfg.GEMINI_API_KEY;
      if (!key) throw new Error("GEMINI_API_KEY belum diisi di config.js");
      const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-2.0-flash-lite"];
      let lastErr = null;
      for (const model of models) {
        try {
          const res = await fetch(
            "https://generativelanguage.googleapis.com/v1/models/" + model + ":generateContent?key=" + key,
            { method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: genCfg }), signal }
          );
          const json = await res.json();
          if (json.error) {
            const msg = json.error.message || "";
            if (json.error.code === 404 || json.error.code === 429 || msg.includes("not found") || msg.includes("quota")) { lastErr = new Error(msg); continue; }
            throw new Error(msg);
          }
          return json.candidates[0].content.parts[0].text;
        } catch(e) {
          if (e.name === "AbortError") throw e;
          lastErr = e; continue;
        }
      }
      throw lastErr || new Error("Semua model Gemini gagal.");
    }

    function buildRaportPrompt(name, rs, data, periodeLabel) {
      const sarans   = rs.filter(r => isValidText(r.saran)).map(r => r.saran);
      const positifs = rs.filter(r => isValidText(r.positive)).map(r => r.positive);
      const avg      = rs.length ? (rs.reduce((s, r) => s + r.avg, 0) / rs.length).toFixed(1) : "0";
      const kelasSet = [...new Set(rs.map(r => r.kelas).filter(Boolean))].join(", ");
      const matkulSet= [...new Set(rs.map(r => r.matkul).filter(Boolean))].join(", ");

      const dimRows = data.DIMENSIONS.map(d => {
        const v = rs.reduce((s, r) => s + (r.scores[d.col] || 0), 0) / rs.length;
        const allV = data.responses.filter(r => r.periode === rs[0]?.periode).reduce((s, r) => s + (r.scores[d.col] || 0), 0) /
          Math.max(1, data.responses.filter(r => r.periode === rs[0]?.periode).length);
        const diff = v - allV;
        return `  ${d.label}: ${v.toFixed(1)} ${diff > 2 ? "▲" : diff < -2 ? "▼" : "≈"} (rata-rata divisi: ${allV.toFixed(1)})`;
      }).join("\n");

      return `Kamu adalah konsultan pengembangan dosen di pesantren tinggi Islam.
Tulis analisis yang jujur, membangun, dan personal untuk pengajar ini — bukan untuk koordinator.

${dimRows}

${positifs.map(t => `- ${t}`).join("\n") || "(tidak ada)"}

=========================

Tulis analisis dengan format PERSIS ini:

RINGKASAN PERFORMA ANDA:

YANG PERLU DITINGKATKAN:

LANGKAH NYATA KE DEPAN:

PESAN PENUTUP:
[2-3 kalimat motivasi yang personal dan spesifik berdasarkan data. Akui kekuatan, acknowledge tantangan, dan dorong untuk terus berkembang.]`;
    }

    // ─── AI Insight Card (Raport) ────────────────────────────
    function RaportAiInsight({ data, name, rs, periodeLabel, periodeId }) {
      const [aiResult, setAiResult] = React.useState(null);
      const [generating, setGenerating] = React.useState(false);
      const abortRef = React.useRef(null);
      const cfg = window.DASHBOARD_CONFIG || {};
      const hasAi = !!(cfg.GEMINI_API_KEY || cfg.APPS_SCRIPT_URL);

      React.useEffect(() => () => { if (abortRef.current) abortRef.current.abort(); }, []);

      const generate = async (force = false) => {
        if (abortRef.current) abortRef.current.abort();
        const ctrl = new AbortController();
        abortRef.current = ctrl;
        const cacheKey = buildRaportAiCacheKey(name, periodeId, rs);
        if (!force) {
          const cached = loadRaportAiCache(cacheKey);
          if (cached) { setAiResult(cached); return; }
        } else {
          try { sessionStorage.removeItem(cacheKey); } catch(e) {}
        }
        setGenerating(true);
        setAiResult(null);
        try {
          const text = await callGeminiRaport(buildRaportPrompt(name, rs, data, periodeLabel), ctrl.signal);
          const result = { ts: new Date().toISOString(), raw: text };
          setAiResult(result);
          saveRaportAiCache(cacheKey, result);
        } catch(e) {
          if (e.name === "AbortError") return;
          setAiResult({ ts: new Date().toISOString(), raw: e.message, error: true });
        } finally {
          setGenerating(false);
          abortRef.current = null;
        }
      };

      const labels = ["RINGKASAN PERFORMA ANDA", "YANG SUDAH BERJALAN BAIK", "YANG PERLU DITINGKATKAN", "LANGKAH NYATA KE DEPAN", "PESAN PENUTUP"];
      const sectionStyle = {
        "RINGKASAN PERFORMA ANDA":    { bg: "var(--surface-2)",           border: "var(--border)",              label: "oklch(0.45 0.01 165)" },
        "YANG SUDAH BERJALAN BAIK":   { bg: "oklch(0.97 0.04 150)",       border: "oklch(0.88 0.07 150)",       label: "oklch(0.4 0.13 150)"  },
        "YANG PERLU DITINGKATKAN":    { bg: "oklch(0.97 0.04 50)",        border: "oklch(0.88 0.07 50)",        label: "oklch(0.48 0.12 50)"  },
        "LANGKAH NYATA KE DEPAN":     { bg: "oklch(0.97 0.04 240)",       border: "oklch(0.88 0.06 240)",       label: "oklch(0.4 0.11 240)"  },
        "PESAN PENUTUP":              { bg: "oklch(0.97 0.05 165)",       border: "oklch(0.88 0.06 165)",       label: "var(--accent-strong)" },
      };

      const parseSections = (raw) => {
        const sections = [];
        let rem = raw;
        labels.forEach(lbl => {
          const idx = rem.toUpperCase().indexOf(lbl + ":");
          if (idx === -1) return;
          const nextIdx = labels.filter(l => l !== lbl).map(l => {
            const i = rem.toUpperCase().indexOf(l + ":", idx + 1);
            return i === -1 ? Infinity : i;
          });
          const end = Math.min(...nextIdx.filter(n => n > idx));
          const content = rem.slice(idx + lbl.length + 1, end === Infinity ? undefined : end).trim();
          sections.push({ lbl, content });
        });
        return sections;
      };

      if (!hasAi) return null;

      return (
        <div className="card" style={{ marginBottom: 16, border: "1.5px solid var(--accent)", background: "linear-gradient(135deg, oklch(0.98 0.02 165), white)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                <div style={{ width: 32, height: 32, borderRadius: 9, background: "var(--accent)", color: "white", display: "grid", placeItems: "center", flexShrink: 0 }}>✦</div>
                <span style={{ fontWeight: 700, fontSize: 15 }}>AI Insight — Analisis Personal</span>
              </div>
              <div style={{ fontSize: 12, color: "var(--fg-muted)", marginLeft: 40 }}>
                Analisis mendalam berbasis data evaluasi Anda · Didukung Gemini AI
                {aiResult && !aiResult.error && <span style={{ marginLeft: 8 }}>· {new Date(aiResult.ts).toLocaleTimeString("id-ID")}</span>}
              </div>
            </div>
            <button
              onClick={() => generate(!!aiResult)}
              disabled={generating}
              style={{
                background: generating ? "var(--surface-2)" : "var(--accent)", color: generating ? "var(--fg-muted)" : "white",
                border: "none", padding: "9px 16px", borderRadius: 10, fontWeight: 600, fontSize: 13,
                cursor: generating ? "not-allowed" : "pointer", display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
              }}>
              {generating ? "⏳ Menganalisis…" : aiResult ? "↺ Re-generate" : "✦ Generate AI Insight"}
            </button>
          </div>

          {!aiResult && !generating && (
            <div style={{ background: "var(--surface-2)", borderRadius: 10, padding: "14px 16px", fontSize: 13, color: "var(--fg-muted)", textAlign: "center" }}>
              Klik tombol di atas untuk mendapatkan analisis mendalam tentang performa Anda, kekuatan, area perbaikan, dan langkah nyata ke depan.
            </div>
          )}

          {aiResult && aiResult.error && (
            <div style={{ background: "oklch(0.97 0.03 25)", border: "1px solid oklch(0.88 0.07 25)", borderRadius: 10, padding: "12px 16px", fontSize: 13, color: "oklch(0.5 0.15 25)" }}>
              ⚠ {aiResult.raw}
              <button onClick={() => generate(true)} style={{ marginLeft: 12, background: "oklch(0.5 0.16 25)", color: "white", border: "none", padding: "5px 12px", borderRadius: 7, fontWeight: 600, fontSize: 12, cursor: "pointer" }}>↺ Coba Lagi</button>
            </div>
          )}

          {aiResult && !aiResult.error && (() => {
            const sections = parseSections(aiResult.raw);
            if (!sections.length) return <p style={{ fontSize: 13.5, lineHeight: 1.75, whiteSpace: "pre-line", margin: 0 }}>{aiResult.raw}</p>;
            return (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {sections.map((s, i) => {
                  const st = sectionStyle[s.lbl] || {};
                  return (
                    <div key={i} style={{ background: st.bg, border: "1px solid " + st.border, borderRadius: 10, padding: "12px 16px" }}>
                      <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.7, textTransform: "uppercase", color: st.label, marginBottom: 8 }}>{s.lbl}</div>
                      <div style={{ fontSize: 13.5, lineHeight: 1.75, whiteSpace: "pre-line" }}>{s.content}</div>
                    </div>
                  );
                })}
              </div>
            );
          })()}
        </div>
      );
    }

    // ---- Raport Screen ----
    function RaportScreen({ data, name, onLogout }) {
      const pengajar = data.PENGAJAR.find(p => p.name === name);

      // Periods that have at least one response for this teacher

        data.PERIODES.filter(p => data.responses.some(r => r.pengajar === name && r.periode === p.id)),
        [data, name]
      );

      const defaultId = (availablePeriodes.find(p => p.current) || availablePeriodes[availablePeriodes.length - 1])?.id || null;
      const [activePeriodeId, setActivePeriodeId] = useState(null);
      const [showCompare, setShowCompare] = useState(false);
      const [selectedMatkul, setSelectedMatkul] = useState(null);
      const [expandedDims, setExpandedDims] = useState(new Set());

      const toggleDim = (key) => setExpandedDims(prev => {
        const s = new Set(prev);
        s.has(key) ? s.delete(key) : s.add(key);
        return s;
      });

      useEffect(() => {
        if (!activePeriodeId && defaultId) setActivePeriodeId(defaultId);
      }, [defaultId]);
      useEffect(() => { setSelectedMatkul(null); }, [activePeriodeId]);

      const periode = data.PERIODES.find(p => p.id === activePeriodeId);

      const myResponses = useMemo(() =>
        activePeriodeId ? data.responses.filter(r => r.pengajar === name && r.periode === activePeriodeId) : [],
        [data, name, activePeriodeId]
      );

      const dimAvgs = useMemo(() => {
        const out = {};
        data.DIMENSIONS.forEach(d => {
          const vals = myResponses.map(r => r.scores[d.col]).filter(v => !isNaN(v) && v > 0);
          out[d.key] = vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0;

      const avg = myResponses.length ? myResponses.reduce((s,r)=>s+r.avg,0)/myResponses.length : 0;

      const strongest = dimsOrdered[0];

      // Matkul → kelas breakdown
      const matkulBreakdown = useMemo(() => {
        if (!myResponses.length) return [];
        const map = {};
        myResponses.forEach(r => {
          const m = r.matkul || "(Tanpa Matkul)";
          if (!map[m]) map[m] = [];

        return Object.entries(map).map(([matkul, rs]) => {
          const a = rs.reduce((s,r)=>s+r.avg,0)/rs.length;
          const dims = {};
          data.DIMENSIONS.forEach(d => { dims[d.key] = rs.reduce((s,r)=>s+(r.scores[d.col]||0),0)/rs.length; });
          const km = {};
          rs.forEach(r => { const k=r.kelas||"(Tanpa Kelas)"; if(!km[k]) km[k]=[]; km[k].push(r); });
          const byKelas = Object.entries(km).map(([kelas,krs]) => {
            const ka = krs.reduce((s,r)=>s+r.avg,0)/krs.length;
            const kd = {};
            data.DIMENSIONS.forEach(d => { kd[d.key]=krs.reduce((s,r)=>s+(r.scores[d.col]||0),0)/krs.length; });
            return { kelas, count: krs.length, avg: ka, dimAvgs: kd };
          }).sort((a,b)=>b.avg-a.avg);
          return { matkul, count: rs.length, avg: a, dimAvgs: dims, byKelas };
        }).sort((a,b)=>b.avg-a.avg);
      }, [myResponses, data.DIMENSIONS]);

      const displayedKelas = useMemo(() => {
        if (selectedMatkul !== null) {

        const map = {};

        return Object.entries(map).map(([kelas,rs]) => {
          const a = rs.reduce((s,r)=>s+r.avg,0)/rs.length;
          const dims = {};
          data.DIMENSIONS.forEach(d => { dims[d.key]=rs.reduce((s,r)=>s+(r.scores[d.col]||0),0)/rs.length; });
          return { kelas, count: rs.length, avg: a, dimAvgs: dims };
        }).sort((a,b)=>b.avg-a.avg);

                      <div className="dim-row" style={{ cursor: quotes.length ? "pointer" : "default" }}
                        onClick={() => quotes.length && toggleDim(d.key)}>
                        <div className="dim-label" style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          {d.label}
                          {quotes.length > 0 && (
                            <span style={{
                              fontSize: 10, fontWeight: 600, padding: "1px 6px", borderRadius: 999,
                              background: isOpen ? "var(--accent-soft)" : "var(--surface-2)",
                              color: isOpen ? "var(--accent-strong)" : "var(--fg-subtle)",
                              border: "1px solid var(--border)",
                            }}>
                              {quotes.length} {isOpen ? "▲" : "▼"}
                            </span>
                          )}
                        </div>
                        <div className="bar-bg"><div className="bar-fill" style={{ width: v + "%", background: scoreColor(v) }}/></div>
                        <span className={"score-pill " + scoreClass(v)}>{v.toFixed(1)}</span>
                      </div>
                      {isOpen && quotes.length > 0 && (
                        <div style={{
                          margin: "6px 0 10px 0", padding: "10px 12px",
                          background: "var(--accent-soft)", borderRadius: 10,
                          borderLeft: "3px solid var(--accent)",
                          maxHeight: 200, overflowY: "auto",
                        }}>
                          <div style={{ fontSize: 11, fontWeight: 700, color: "var(--accent-strong)", marginBottom: 7, textTransform: "uppercase", letterSpacing: 0.5 }}>
                            Saran mahasiswa untuk perbaikan · {d.label}
                          </div>
                          {quotes.slice(0, 15).map((q, i) => (
                            <div key={i} style={{ fontSize: 12.5, lineHeight: 1.55, marginBottom: 7, paddingBottom: 7, borderBottom: i < quotes.length - 1 ? "1px solid oklch(0.88 0.05 165)" : "none" }}>
                              <span style={{ color: "var(--fg-subtle)", fontSize: 11, marginRight: 5 }}>{q.kelas}{q.matkul ? " · " + q.matkul : ""}</span>
                              <br/>
                              <span style={{ color: "var(--accent-strong)" }}>"{q.text}"</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Catatan */}
          <div className="catatan">
            <strong>Catatan:</strong> Skor menggunakan skala 0–100. 95–100 = Sangat Baik · 80–94 = Baik · 65–79 = Cukup · &lt;65 = Perlu Perhatian.
          </div>

          {/* Per Mata Pelajaran & Kelas */}
          {matkulBreakdown.length > 0 && (
            <div className="card" style={{ marginTop: 16 }}>
              <div className="card-title">Per Mata Pelajaran &amp; Kelas</div>
              <div className="card-sub">
                {selectedMatkul ? "Menampilkan kelas untuk: " + selectedMatkul : "Pilih mata pelajaran untuk detail per kelas"}
              </div>

              {matkulBreakdown.length > 1 && (
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "12px 0 16px" }}>
                  <button onClick={() => setSelectedMatkul(null)} style={tabStyle(selectedMatkul === null)}>
                    Semua Kelas
                  </button>
                  {matkulBreakdown.map(m => (
                    <button key={m.matkul}
                      onClick={() => setSelectedMatkul(m.matkul === selectedMatkul ? null : m.matkul)}
                      style={{ ...tabStyle(selectedMatkul === m.matkul), display: "flex", alignItems: "center", gap: 7 }}>
                      <span>{m.matkul}</span>
                      <span className={"score-pill " + scoreClass(m.avg)} style={{ fontSize: 11, padding: "1px 7px" }}>{m.avg.toFixed(1)}</span>
                      <span style={{ color: "var(--fg-subtle)", fontSize: 11 }}>{m.count}×</span>
                    </button>
                  ))}
                </div>
              )}

              <div>
                {displayedKelas.map(k => {
                  const kDimsOrdered = [...data.DIMENSIONS].sort((a,b) => (k.dimAvgs[b.key]||0) - (k.dimAvgs[a.key]||0));
                  const kStrongest = kDimsOrdered[0];
                  const kWeakest   = kDimsOrdered[kDimsOrdered.length - 1];
                  return (
                    <div key={k.kelas} style={{
                      border: "1px solid var(--border)", borderRadius: 12,
                      padding: "14px 16px", background: "var(--surface-2)", marginBottom: 10,
                    }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 14 }}>{k.kelas}</div>
                          <div style={{ fontSize: 12, color: "var(--fg-muted)", marginTop: 3 }}>
                            {k.count} responden
                            {kStrongest && <span> · <span style={{ color: "oklch(0.4 0.13 150)" }}>Kuat: {kStrongest.label}</span></span>}
                            {kWeakest && kWeakest.key !== kStrongest?.key && <span> · <span style={{ color: "oklch(0.52 0.15 50)" }}>Fokus: {kWeakest.label}</span></span>}
                          </div>
                        </div>
                        <span className={"score-pill " + scoreClass(k.avg)} style={{ fontSize: 15, padding: "4px 13px", fontWeight: 700 }}>
                          {k.avg.toFixed(1)}
                        </span>
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                        {data.DIMENSIONS.map(d => {
                          const v = k.dimAvgs[d.key] || 0;
                          return (
                            <div key={d.key} style={{ display: "grid", gridTemplateColumns: "130px 1fr 44px", gap: 8, alignItems: "center" }}>
                              <div style={{ fontSize: 12, color: "var(--fg-muted)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.label}</div>
                              <div style={{ height: 6, background: "var(--border)", borderRadius: 999 }}>
                                <div style={{ height: "100%", width: v + "%", background: scoreColor(v), borderRadius: 999, transition: "width 0.5s" }}/>
                              </div>
                              <span style={{ fontSize: 11, fontFamily: "var(--mono)", textAlign: "right", color: "var(--fg-muted)" }}>{v.toFixed(1)}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Hal Terbaik — grouped by matkul if multiple subjects */}
          {positifList.length > 0 && (
            <div className="card" style={{ marginTop: 16 }}>
              <div className="card-title" style={{ color: "oklch(0.4 0.13 150)" }}>✓ Hal Terbaik Menurut Mahasiswa</div>
              <div className="card-sub">Komentar verbatim — apa yang paling membantu mahasiswa belajar</div>
              {matkulBreakdown.length > 1
                ? matkulBreakdown.map(m => {
                    const ms = positifList.filter(r => (r.matkul || "(Tanpa Matkul)") === m.matkul);
                    if (!ms.length) return null;
                    return (
                      <div key={m.matkul}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "var(--fg-subtle)", textTransform: "uppercase", letterSpacing: 0.5, margin: "14px 0 7px" }}>
                          {m.matkul}
                        </div>
                        {ms.slice(0, 6).map((r, i) => (
                          <div key={i} className="saran-item">
                            <div className="saran-meta">{r.kelas}</div>
                            <div>"{r.positive}"</div>
                          </div>
                        ))}
                      </div>
                    );
                  })
                : positifList.slice(0, 8).map((r, i) => (
                    <div key={i} className="saran-item">
                      <div className="saran-meta">{r.kelas} · {r.matkul}</div>
                      <div>"{r.positive}"</div>
                    </div>
                  ))
              }
            </div>
          )}

          {/* Saran — grouped by matkul if multiple subjects */}
          {saranList.length > 0 && (
            <div className="card">
              <div className="card-title" style={{ color: "oklch(0.5 0.15 75)" }}>💬 Saran dari Mahasiswa</div>
              <div className="card-sub">{saranList.length} saran bermakna dari mahasiswa</div>
              {matkulBreakdown.length > 1
                ? matkulBreakdown.map(m => {
                    const ms = saranList.filter(r => (r.matkul || "(Tanpa Matkul)") === m.matkul);
                    if (!ms.length) return null;
                    return (
                      <div key={m.matkul}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "var(--fg-subtle)", textTransform: "uppercase", letterSpacing: 0.5, margin: "14px 0 7px" }}>
                          {m.matkul}
                        </div>
                        {ms.slice(0, 8).map((r, i) => (
                          <div key={i} className="saran-item">
                            <div className="saran-meta">{r.kelas}</div>
                            <div>"{r.saran}"</div>
                          </div>
                        ))}
                      </div>
                    );
                  })
                : saranList.slice(0, 10).map((r, i) => (
                    <div key={i} className="saran-item">
                      <div className="saran-meta">{r.kelas} · {r.matkul}</div>
                      <div>"{r.saran}"</div>
                    </div>
                  ))
              }
            </div>
          )}

          {/* AI Insight */}
          <RaportAiInsight
            data={data}
            name={name}
            rs={myResponses}
            periodeLabel={periode.label}
            periodeId={activePeriodeId}
          />

          {/* Footer */}
          <div className="footer-note">
            <div>Divisi I'dad Lughawi STDIIS · Sistem Evaluasi Pengajar · {periode.label}</div>
            <div>Dicetak {printedAt} · Rahasia — hanya untuk pengajar bersangkutan</div>
          </div>
        </div>
      );
    }

    // ---- App ----
    function App() {
      const [data, setData] = useState(null);
      const [loadError, setLoadError] = useState(null);
      const [loggedIn, setLoggedIn] = useState(null);
      const [tokenChecking, setTokenChecking] = useState(false);

      const loadData = () => {
        setLoadError(null);
        setData(null);
        window.DataLoader.load().then(d => {
          setData(d);
          const params = new URLSearchParams(window.location.search);

          // ?token= → verifikasi ke server, auto-login tanpa PIN
          const token = params.get("token");
          if (token) {
            setTokenChecking(true);
            window.DataLoader.verifyToken(token).then(res => {
              setTokenChecking(false);
              if (res.ok && res.name) setLoggedIn(res.name);
              // Jika token salah, tampilkan layar login biasa
            }).catch(() => setTokenChecking(false));
            return;
          }

          // ?name= → auto-login langsung (legacy / admin preview)
          const urlName = params.get("name");
          if (urlName && d.PENGAJAR.some(p => p.name === urlName)) {
            setLoggedIn(urlName);
          }
        }).catch(err => {
          setLoadError(err.message || "Gagal memuat data");
        });
      };

      useEffect(() => { loadData(); }, []);

      if (!data && !loadError) return <LoadingScreen />;
      if (loadError) return <LoadingScreen error={loadError} onRetry={loadData} />;
      if (tokenChecking) return <LoadingScreen tokenChecking />;

      if (!loggedIn) {
        return <LoginScreen data={data} onLogin={(name) => setLoggedIn(name)} />;
      }
      return <RaportScreen data={data} name={loggedIn} onLogout={() => setLoggedIn(null)} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
  <style>
    @media print {
      #print-header { display: block !important; }
    }
  </style>
  <script>
    // Daftarkan Service Worker untuk PWA offline-first
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then(function(reg) {
            console.log("[SW] Terdaftar:", reg.scope);
          })
          .catch(function(err) {
            console.warn("[SW] Gagal daftar:", err);
          });
      });
    }
  </script>
</body>
</html>
